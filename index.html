<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優兒大腦開發 - 教學老師每週工作報表</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-size: 21px; }
        
        .header-banner { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 30px 15px; border-radius: 0 0 22px 22px; margin-bottom: 22px; box-shadow: 0 6px 9px rgba(0,0,0,0.05); }
        .header-banner h5 { font-size: 1.8rem; font-weight: bold; }
        .header-banner p { font-size: 1.1rem; }

        .card-custom { background: white; border-radius: 18px; border: 1px solid #e2e8f0; margin-bottom: 22px; padding: 22px; box-shadow: 0 3px 6px rgba(0,0,0,0.02); }
        .day-header { background-color: #e2e8f0; color: #1e3a8a; font-weight: bold; padding: 15px; border-radius: 12px; cursor: pointer; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
        .section-title { font-size: 22px; font-weight: bold; color: #1e3a8a; border-left: 6px solid #2563eb; padding-left: 12px; margin-bottom: 18px; }
        
        /* 標籤區塊排版 */
        .grid-label-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 64px; 
            margin-bottom: 6px;
        }

        .grid-label { 
            font-size: 18px; 
            font-weight: bold; 
            color: #475569; 
            line-height: 1.2;
            display: block;
            width: 100%;
        }

        /* 6字項目：上4下2分散置中 */
        .label-6char-container {
            display: block;
            text-align: center;
            width: 100%;
        }
        .label-6char-top {
            display: block;
            letter-spacing: -0.5px;
            margin-bottom: 1px;
        }
        .label-6char-bottom {
            display: block;
            text-align: justify;
            text-align-last: justify; 
            padding: 0 12px;          
        }

        .label-5char {
            display: block;
            text-align: center;
            white-space: nowrap;
        }
        
        .label-center {
            text-align: center;
        }
        
        /* 輸入框高度強制一致，改為 text 類型以支援算式 */
        .form-control, .form-select { font-size: 20px; padding: 10px 15px; border-radius: 10px; height: 55px; }
        .form-control-sm { font-size: 19px; padding: 8px 12px; height: 55px; }

        .btn-submit { background: linear-gradient(135deg, #16a34a, #15803d); color: white; font-weight: bold; padding: 20px; width: 100%; border: none; border-radius: 15px; font-size: 24px; box-shadow: 0 6px 15px rgba(22,163,74,0.15); }
        
        .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.92); z-index:9999; justify-content: center; align-items: center; flex-direction: column; font-size: 24px; }
        
        /* 🕒 全新優化的上課時段區域樣式 */
        .ts-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 手機端改為2欄，更方便點選下方複選框 */
            gap: 15px; 
            width: 100%;
        }
        .ts-item-box {
            background-color: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px;
            transition: all 0.2s ease;
        }
        .ts-item-box.active {
            border-color: #3b82f6;
            background-color: #f0f6ff;
            box-shadow: 0 4px 6px rgba(59,130,246,0.05);
        }
        .ts-main-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 5px;
            padding: 6px 0;
            background: #f8fafc;
            border-radius: 6px;
        }
        .ts-main-checkbox { margin-right: 8px; transform: scale(1.2); }
        
        /* 時段下方延伸的可勾選項目 (補課、請假、試上) */
        .ts-sub-options {
            display: none; /* 預設隱藏，主按鈕勾選後才展開 */
            justify-content: space-around;
            border-top: 1px dashed #cbd5e1;
            padding-top: 8px;
            margin-top: 5px;
        }
        .ts-sub-label {
            font-size: 14px;
            font-weight: normal;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .ts-sub-label input { transform: scale(1); }

        .day-body-content { display: none; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <div class="mt-3 fw-bold text-secondary" id="loadingText">智慧報表系統加載中...</div>
    </div>

    <div class="header-banner text-center">
        <h5 class="mb-1">教學老師每週工作報表</h5>
    </div>

    <div class="container mb-5" style="max-width: 750px;">
        <form id="weeklyForm">
            
            <div class="card-custom">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label fw-bold" style="font-size: 18px;">月份 / 週數 </label>
                        <select class="form-select" id="monthWeek" required style="height: 55px;">
                            <option value="">請選擇週數</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold" style="font-size: 18px;">任課老師</label>
                        <select class="form-select" id="teacher" required style="height: 55px;">
                            <option value="">載入中...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section-title">📅 每日課堂人數與時段填報 (週二至週六)</div>

            <div id="daysContainer"></div>

            <div class="card-custom">
                <div class="section-title">📝 重要記事欄位</div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">新生姓名</label>
                    <input type="text" class="form-control" id="noteNewStudent" placeholder="請輸入新生姓名">
                </div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">結業姓名 / 期數 / 續課姓名</label>
                    <textarea class="form-control" id="noteGradRenew" rows="2" placeholder="請輸入結業與續課資訊" style="height: auto;"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">補課姓名 / 補課時段</label>
                    <input type="text" class="form-control" id="noteMakeup" placeholder="如: 王小明 (週三 2-3)">
                </div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">姓名 / 時段調整</label>
                    <input type="text" class="form-control" id="noteTimeAdjust" placeholder="如: 李小美 調整至 4-5">
                </div>
            </div>

            <button type="submit" class="btn-submit mb-4" id="submitBtn">確認提交整週雲端報表</button>
        </form>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwhbfXseG08Sna2gud6DEWjhGz0LWOq4D-7wbURoKS0ul88taIdXu45xPt3c9_pHuiN/exec";
        
        const overlay = document.getElementById('loadingOverlay');
        const daysContainer = document.getElementById('daysContainer');

        window.addEventListener('DOMContentLoaded', () => {
            overlay.style.display = 'flex';
            generateMonthWeekOptions();
            
            const script = document.createElement('script');
            script.src = `${GAS_API_URL}?callback=initWeeklyForm`;
            document.body.appendChild(script);
        });

        function generateMonthWeekOptions() {
            const select = document.getElementById('monthWeek');
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const nextMonth = currentMonth === 12 ? 1 : currentMonth + 1;
            const weeks = ["第一週", "第二週", "第三週", "第四週", "第五週"];
            
            let html = '<option value="">請選擇週數</option>';
            weeks.forEach(w => html += `<option value="${currentMonth}月 ${w}">${currentMonth}月 ${w}</option>`);
            weeks.forEach(w => html += `<option value="${nextMonth}月 ${w}">${nextMonth}月 ${w}</option>`);
            select.innerHTML = html;
        }

        // 安全解析並加總字串算式的功能 (例如把 "12+2-1" 變成 13)
        function parseExpression(str) {
            if (!str) return 0;
            // 只允許數字、小數點、加號、減號
            const cleanStr = str.replace(/[^0-9.+\-]/g, '');
            if (!cleanStr) return 0;
            try {
                // 使用 Function 安全評估算式結果
                return Function(`return (parseFloat(${cleanStr.replace(/([+\-])/g, ')$1parseFloat(')}))`)() || 0;
            } catch (e) {
                // 如果使用者打到一半(如 "5+")，先解析前面合法的數字
                try {
                    const match = cleanStr.match(/^([0-9.+\-]+)[+\-]$/);
                    if(match) return Function(`return (${match[1]})`)() || 0;
                } catch(err) {}
                return 0;
            }
        }

        function initWeeklyForm(config) {
            const teacherSelect = document.getElementById('teacher');
            let tHtml = '<option value="">請選擇老師</option>';
            config.teachers.forEach(t => tHtml += `<option value="${t}">${t}</option>`);
            teacherSelect.innerHTML = tHtml;

            let daysHtml = '';
            const daysArr = config.days;

            daysArr.forEach((day, index) => {
                daysHtml += `
                <div class="card-custom border-primary">
                    <div class="day-header" onclick="toggleCollapse('box_${index}')">
                        <span>📌 ${day} 工作報表</span>
                        <span class="small text-secondary" style="font-size: 16px;">點擊展開 ▽</span>
                    </div>
                    <div id="box_${index}" class="day-body-content" style="display: none;">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="grid-label-wrapper" style="height:auto;">
                                    <label class="grid-label text-primary">選擇正確日期 (對應${day})</label>
                                </div>
                                <input type="date" class="form-control form-control-sm persistent" id="date_${index}">
                            </div>
                            
                            <div class="col-4 mt-2">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-5char">原學生人次</label>
                                </div>
                                <input type="text" class="form-control form-control-sm calc-val persistent" id="orig_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4 mt-2">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">新加學生</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm calc-val persistent" id="new_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4 mt-2">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">結業學生</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm calc-val persistent" id="grad_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">續課學生</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm calc-val persistent" id="renew_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-center">上課調整</label>
                                </div>
                                <input type="text" class="form-control form-control-sm calc-val persistent" id="adj_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label text-primary label-5char">應上課人次</label>
                                </div>
                                <input type="text" class="form-control form-control-sm bg-light text-primary fw-bold" id="should_${index}" placeholder="0" readonly>
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-center">請假人次</label>
                                </div>
                                <input type="text" class="form-control form-control-sm calc-val persistent" id="leave_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label text-success label-6char-container">
                                        <span class="label-6char-top">實際上課</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm bg-light text-success fw-bold" id="actual_${index}" placeholder="0" readonly>
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-center">試上人數</label>
                                </div>
                                <input type="text" class="form-control form-control-sm persistent" id="trial_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">老師應上</span>
                                        <span class="label-6char-bottom">時數</span>
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm persistent" id="thour_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">實際上課</span>
                                        <span class="label-6char-bottom">時數</span>
                                    </label>
                                </div>
                                <input type="text" class="form-control form-control-sm persistent" id="ahour_${index}" placeholder="0">
                            </div>
                            
                            <div class="col-12">
                                <label class="grid-label">請假姓名</label>
                                <input type="text" class="form-control form-control-sm persistent" id="leavename_${index}" placeholder="請輸入請假學生姓名" style="height: 55px;">
                            </div>

                            <div class="col-12 mt-2">
                                <label class="grid-label d-block text-primary">🕒 上課時段 (勾選時段後可複選細項)</label>
                                <div class="ts-container">
                                    ${config.timeSlots.map(ts => {
                                        const cleanTsId = ts.replace(/-/, '_');
                                        return `
                                        <div class="ts-item-box" id="tsBox_${index}_${cleanTsId}">
                                            <label class="ts-main-label">
                                                <input type="checkbox" class="ts-main-checkbox" id="tsMain_${index}_${cleanTsId}" value="${ts}" onchange="toggleTimeSlotStatus(${index}, '${cleanTsId}')">
                                                <span>${ts}</span>
                                            </label>
                                            <div class="ts-sub-options" id="tsSub_${index}_${cleanTsId}">
                                                <label class="ts-sub-label"><input type="checkbox" class="ts-sub-cb" data-day="${index}" data-slot="${ts}" value="補課" onchange="saveCbStatus()"> 補課</label>
                                                <label class="ts-sub-label"><input type="checkbox" class="ts-sub-cb" data-day="${index}" data-slot="${ts}" value="請假" onchange="saveCbStatus()"> 請假</label>
                                                <label class="ts-sub-label"><input type="checkbox" class="ts-sub-cb" data-day="${index}" data-slot="${ts}" value="試上" onchange="saveCbStatus()"> 試上</label>
                                            </div>
                                        </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            daysContainer.innerHTML = daysHtml;
            setupCalcLogic(config.days.length);
            setupPersistence(); 
            overlay.style.display = 'none';
        }

        // 時段主按鈕勾選與展開邏輯
        function toggleTimeSlotStatus(dayIdx, cleanTsId) {
            const mainCb = document.getElementById(`tsMain_${dayIdx}_${cleanTsId}`);
            const subBox = document.getElementById(`tsSub_${dayIdx}_${cleanTsId}`);
            const itemBox = document.getElementById(`tsBox_${dayIdx}_${cleanTsId}`);
            
            if (mainCb.checked) {
                subBox.style.display = 'flex';
                itemBox.classList.add('active');
            } else {
                subBox.style.display = 'none';
                itemBox.classList.remove('active');
                // 主按鈕取消時，子按鈕一併清空
                subBox.querySelectorAll('input').forEach(cb => cb.checked = false);
            }
            saveCbStatus();
        }

        function toggleCollapse(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'block' : 'none';
        }

        function setupCalcLogic(daysCount) {
            for(let i=0; i<daysCount; i++) {
                const inputs = [`orig_${i}`, `new_${i}`, `grad_${i}`, `renew_${i}`, `adj_${i}`, `leave_${i}`];
                inputs.forEach(id => {
                    document.getElementById(id).addEventListener('input', () => {
                        calculateRow(i);
                    });
                });
            }
        }

        // 💡 依據主任指定公式進行動態算式解析加總
        function calculateRow(i) {
            const orig = parseExpression(document.getElementById(`orig_${i}`).value);
            const n = parseExpression(document.getElementById(`new_${i}`).value);
            const g = parseExpression(document.getElementById(`grad_${i}`).value);
            const r = parseExpression(document.getElementById(`renew_${i}`).value);
            const adj = parseExpression(document.getElementById(`adj_${i}`).value);
            const leave = parseExpression(document.getElementById(`leave_${i}`).value);

            // 公式1：應上課人次 = 原學生人次 + 新加學生人次 + 結業學生人次 + 續課學生人次 + 上課調整
            let should = orig + n + g + r + adj;
            if(should < 0) should = 0;
            document.getElementById(`should_${i}`).value = should % 1 === 0 ? should : should.toFixed(1);

            // 公式2：實際上課人次 = 應上課人次 + 請假人次
            let actual = should + leave;
            if(actual < 0) actual = 0;
            document.getElementById(`actual_${i}`).value = actual % 1 === 0 ? actual : actual.toFixed(1);
        }

        // 快取儲存子項目狀態
        function saveCbStatus() {
            // 儲存主時段狀態
            document.querySelectorAll('.ts-main-checkbox').forEach(cb => {
                localStorage.setItem(cb.id, cb.checked);
            });
            // 儲存子項目狀態
            document.querySelectorAll('.ts-sub-cb').forEach((cb, idx) => {
                localStorage.setItem(`subcb_${cb.dataset.day}_${cb.dataset.slot}_${cb.value}`, cb.checked);
            });
        }

        function setupPersistence() {
            const basicInputs = ['monthWeek', 'teacher', 'noteNewStudent', 'noteGradRenew', 'noteMakeup', 'noteTimeAdjust'];
            basicInputs.forEach(id => {
                const el = document.getElementById(id);
                if(localStorage.getItem(id)) el.value = localStorage.getItem(id);
                el.addEventListener('input', () => localStorage.setItem(id, el.value));
            });

            document.querySelectorAll('.persistent').forEach(input => {
                if(localStorage.getItem(input.id)) {
                    input.value = localStorage.getItem(input.id);
                }
                input.addEventListener('input', () => {
                    localStorage.setItem(input.id, input.value);
                    if(input.classList.contains('calc-val')) {
                        const idx = input.id.split('_')[1];
                        calculateRow(idx);
                    }
                });
            });

            // 回填恢復時段與子項目快取
            document.querySelectorAll('.ts-main-checkbox').forEach(cb => {
                if(localStorage.getItem(cb.id) === 'true') {
                    cb.checked = true;
                    const parts = cb.id.split('_');
                    toggleTimeSlotStatus(parts[1], parts[2]);
                }
            });
            document.querySelectorAll('.ts-sub-cb').forEach(cb => {
                if(localStorage.getItem(`subcb_${cb.dataset.day}_${cb.dataset.slot}_${cb.value}`) === 'true') {
                    cb.checked = true;
                }
            });

            for(let i=0; i<5; i++) { calculateRow(i); }
        }

        function clearAllCache() {
            localStorage.clear();
        }

        document.getElementById('weeklyForm').addEventListener('submit', (e) => {
            e.preventDefault();
            overlay.style.display = 'flex';
            document.getElementById('loadingText').innerText = "每週總表資料打包傳輸中...";
            document.getElementById('submitBtn').disabled = true;

            const daysArr = ["週二", "週三", "週四", "週五", "週六"];
            const weeklyData = [];

            for(let i=0; i<5; i++) {
                const dateVal = document.getElementById(`date_${i}`).value;
                
                const hasData = document.getElementById(`orig_${i}`).value || document.getElementById(`new_${i}`).value || 
                                document.getElementById(`grad_${i}`).value || document.getElementById(`renew_${i}`).value || 
                                document.getElementById(`adj_${i}`).value  || document.getElementById(`leave_${i}`).value;
                                
                if(hasData && !dateVal) {
                    alert(`❌ 您填寫了【${daysArr[i]}】的數據，但忘記填上日期！請補上日期後再行送出。`);
                    document.getElementById(`box_${i}`).style.display = 'block'; 
                    overlay.style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                    return;
                }

                if(!dateVal) continue; 

                // 收集該天有被勾選的時段以及它們附帶的補課/請假/試上狀態
                const dayTimeSlotsCollected = [];
                const mainCheckboxes = document.querySelectorAll(`.ts-main-checkbox`);
                mainCheckboxes.forEach(cb => {
                    const idParts = cb.id.split('_'); // [tsMain, dayIdx, cleanTsId]
                    if (parseInt(idParts[1]) === i && cb.checked) {
                        const slotValue = cb.value;
                        const subStatuses = [];
                        const subBoxes = document.querySelectorAll(`.ts-sub-cb[data-day="${i}"][data-slot="${slotValue}"]:checked`);
                        subBoxes.forEach(scb => subStatuses.push(scb.value));
                        
                        dayTimeSlotsCollected.push({
                            slot: slotValue,
                            status: subStatuses
                        });
                    }
                });

                weeklyData.push({
                    day: daysArr[i],
                    dateStr: dateVal, 
                    // 傳送到後端時保留老師原始輸入的算式字串
                    originalCount: document.getElementById(`orig_${i}`).value || "0",
                    newCount: document.getElementById(`new_${i}`).value || "0",
                    gradCount: document.getElementById(`grad_${i}`).value || "0",
                    renewCount: document.getElementById(`renew_${i}`).value || "0",
                    adjustReq: document.getElementById(`adj_${i}`).value || "0",
                    // 計算完後的淨值結果上傳
                    shouldAttend: document.getElementById(`should_${i}`).value || "0",
                    leaveCount: document.getElementById(`leave_${i}`).value || "0",
                    actualCount: document.getElementById(`actual_${i}`).value || "0",
                    trialCount: document.getElementById(`trial_${i}`).value || "0",
                    teacherHours: document.getElementById(`thour_${i}`).value || "0",
                    actualHours: document.getElementById(`ahour_${i}`).value || "0",
                    leaveNames: document.getElementById(`leavename_${i}`).value,
                    timeSlots: dayTimeSlotsCollected
                });
            }

            if(weeklyData.length === 0) {
                alert("❌ 請至少展開填寫其中一天的日期與報表資料再行提交！");
                overlay.style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                return;
            }

            const mainPayload = {
                monthWeek: document.getElementById('monthWeek').value,
                teacher: document.getElementById('teacher').value,
                weeklyData: weeklyData,
                notes: {
                    newStudent: document.getElementById('noteNewStudent').value,
                    gradRenew: document.getElementById('noteGradRenew').value,
                    makeup: document.getElementById('noteMakeup').value,
                    timeAdjust: document.getElementById('noteTimeAdjust').value
                }
            };

            fetch(GAS_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(mainPayload)
            }).then(() => {
                alert("【成功】全週報表已順利匯入您在 Google 試算表的個人專屬分頁中！");
                clearAllCache(); 
                location.reload();
            }).catch(err => {
                alert("傳輸發生異常：" + err);
            }).finally(() => {
                overlay.style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            });
        });
    </script>
</body>
</html>
