<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優兒台南教學部 - 週報表填報系統</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f8fafc; --text: #334155; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 25px; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .section-title { font-size: 16px; font-weight: bold; color: #2563eb; margin: 20px 0 10px 0; display: flex; align-items: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,144,226,0.2); }
        .calc-preview { background: #f1f5f9; padding: 12px; border-radius: 6px; margin-top: 5px; font-size: 13px; color: #475569; font-style: italic; }
        .btn-group { margin-top: 30px; display: flex; gap: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-submit { background: #10b981; color: white; }
        .btn-submit:hover { background: #059669; }
        .btn-clear { background: #ef4444; color: white; }
        .btn-clear:hover { background: #dc2626; }
        textarea { resize: vertical; min-height: 80px; }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 優兒每週報表數據填報入口</h2>
    
    <form id="reportForm" onsubmit="handleSubmit(event)">
        <div class="grid">
            <div>
                <label>選擇填報週別</label>
                <select id="week" required onchange="handleWeekChange()">
                    <option value="">-- 請選擇週別 --</option>
                    <option value="1">第一週</option>
                    <option value="2">第二週</option>
                    <option value="3">第三週</option>
                    <option value="4">第四週</option>
                    <option value="5">第五週</option>
                </select>
            </div>
            <div>
                <label>老師姓名 / 選項</label>
                <select id="teacherName" required onchange="handleTeacherChange()">
                    <option value="">-- 請選擇老師 --</option>
                    <option value="黃曉萍">黃曉萍</option>
                    <option value="黃嘉綾">黃嘉綾</option>
                    <option value="蘇郁晶">蘇郁晶</option>
                    <option value="林怡如">林怡如</option>
                    <option value="李靜婷">李靜婷</option>
                    <option value="陳佳玲">陳佳玲</option>
                    <option value="黃盈瑄">黃盈瑄</option>
                    <option value="陳碧文">陳碧文</option>
                    <option value="其他/代課">其他/代課</option> </select>
            </div>
        </div>

        <div class="section-title">📊 核心人次數據統計 (留空或非數字將自動視為 0 虛擬預設)</div>
        
        <div class="grid">
            <div>
                <label>原學生人次 (🌟 支援繼承功能)</label>
                <input type="text" id="totalOrig" placeholder="0" oninput="calculateOnFly()">
                <div id="inheritNotice" style="font-size:11px; color:#16a34a; margin-top:2px; display:none;">已自動幫您繼承上週的應上課人次！</div>
            </div>
            <div>
                <label>新加學生人次</label>
                <input type="text" id="totalNew" placeholder="0" oninput="calculateOnFly()">
            </div>
            <div>
                <label>結業學生人次</label>
                <input type="text" id="totalEnd" placeholder="0" oninput="calculateOnFly()">
            </div>
            <div>
                <label>續課學生人次</label>
                <input type="text" id="totalAdj" placeholder="0">
            </div>
            <div class="full-width">
                <label>學生上課時間調整描述</label>
                <input type="text" id="totalTimeMove" placeholder="例如：無、或特定學生改時段">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>請假/補課學生人次 (🌟 忽略空格，可輸入算式如 +2-4)</label>
                <input type="text" id="totalLeave" placeholder="0" oninput="calculateOnFly()">
                <div class="calc-preview" id="leavePreview">動態解析預覽：0 人次</div>
            </div>
            <div>
                <label>試上人次</label>
                <input type="text" id="totalTry" placeholder="0">
            </div>
            <div class="full-width">
                <label>應上時數</label>
                <input type="text" id="totalHours" placeholder="0">
            </div>
        </div>

        <div class="section-title">✍️ 三大獨立全週重要備忘錄 (不擠在一格，完美擴充儲存)</div>
        <div class="full-width" style="margin-bottom: 15px;">
            <label>1. 新生姓名與詳細記事</label>
            <textarea id="memoNewStudents" placeholder="請輸入本週新加學生的姓名與上課狀況..."></textarea>
        </div>
        <div class="full-width" style="margin-bottom: 15px;">
            <label>2. 結業 / 期數 / 續課學生姓名記事</label>
            <textarea id="memoGraduated" placeholder="請輸入本週結業、續課學生的姓名與期數..."></textarea>
        </div>
        <div class="full-width" style="margin-bottom: 15px;">
            <label>3. 姓名 / 上課時段變更詳細調動資訊</label>
            <textarea id="memoAdjustments" placeholder="請詳細記錄本週調整上課時間的學生姓名與新舊時段..."></textarea>
        </div>

        <div id="statusBox" class="status-msg"></div>

        <div class="btn-group">
            <button type="button" class="btn-clear" onclick="clearForm(true)">🧹 清空防呆</button> <button type="submit" class="btn-submit">🚀 精準送出至人事月總表</button>
        </div>
    </form>
</div>

<script>
    // 🌟 核心網址配置（此處已預留為您的 GAS Web App 正確網址）
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw9F0S.../exec"; 

    // 本地快取暫存空間，用來實現「上週應上課自動繼承至本週原學」的功能
    const localDatabase = JSON.parse(localStorage.getItem('优儿週報快取') || '{}');

    // 1. 安全數字轉換（虛擬 0 Placeholder 邏輯與加總忽略空格）
    function getSafeNumber(id) {
        const val = document.getElementById(id).value.replace(/\s+/g, ''); // 忽略所有空格
        if (!val) return 0;
        const num = parseFloat(val);
        return isNaN(num) ? 0 : num;
    }

    // 2. 動態請假算式解析與預覽 (+2-4)
    function parseLeaveFormula(str) {
        const cleanStr = str.replace(/\s+/g, ''); // 忽略空格
        if (!cleanStr) return 0;
        
        // 防呆防駭：只允許數字與 + - 符號
        if (!/^[0-9+\-]+$/.test(cleanStr)) return 0;
        
        try {
            // 使用 Function 代替 eval 進行安全且精準的動態數學計算
            return Function(`return (${cleanStr})`)();
        } catch {
            return 0;
        }
    }

    // 3. 即時動態填報試算預覽
    function calculateOnFly() {
        const orig = getSafeNumber('totalOrig');
        const xnew = getSafeNumber('totalNew');
        const shouldAttend = orig + xnew; // 應上課人次 = 原學生 + 新加
        
        const leaveInput = document.getElementById('totalLeave').value;
        const leaveResult = parseLeaveFormula(leaveInput);
        
        const previewDiv = document.getElementById('leavePreview');
        previewDiv.innerText = `動態解析預覽：${leaveResult >= 0 ? '+' : ''}${leaveResult} 人次 (會連動調整實際上課人次)`;
    }

    // 4. 🌟 核心神級功能：上週應上自動繼承至本週原學
    function handleWeekChange() {
        const week = document.getElementById('week').value;
        const teacher = document.getElementById('teacherName').value;
        const inheritNotice = document.getElementById('inheritNotice');
        
        inheritNotice.style.display = 'none';
        
        if (!week || !teacher || week === "1") return; // 第一週不需要繼承
        
        const lastWeek = (parseInt(week) - 1).toString();
        const cacheKey = `${teacher}_week_${lastWeek}`;
        
        if (localDatabase[cacheKey]) {
            // 找到上週的歷史紀錄，自動計算出上週的「應上課人次」作為本週的「原學生人次」
            const lastOrig = parseFloat(localDatabase[cacheKey].totalOrig) || 0;
            const lastNew = parseFloat(localDatabase[cacheKey].totalNew) || 0;
            const inheritedOrig = lastOrig + lastNew; // 上週的應上課人次
            
            document.getElementById('totalOrig').value = inheritedOrig;
            inheritNotice.style.display = 'block';
            calculateOnFly();
        }
    }

    function handleTeacherChange() {
        handleWeekChange(); // 老師切換時也要同步觸發繼承檢查
    }

    // 5. 🧹 清空防呆按鈕邏輯
    function clearForm(isManual) {
        if (isManual && !confirm("您確定要清空目前輸入的所有欄位資料嗎？")) return;
        document.getElementById('reportForm').reset();
        document.getElementById('leavePreview').innerText = "動態解析預覽：0 人次";
        document.getElementById('inheritNotice').style.display = 'none';
    }

    // 6. 🚀 表單非同步安全送出
    function handleSubmit(event) {
        event.preventDefault();
        
        const statusBox = document.getElementById('statusBox');
        statusBox.style.display = "block";
        statusBox.style.background = "#f1f5f9";
        statusBox.style.color = "#1e293b";
        statusBox.innerText = "⏳ 正在精準校對並連動至人事後端月總表，請稍候...";

        // 封裝完全對齊後端規格的 JSON 資料包
        const payload = {
            week: document.getElementById('week').value,
            teacherName: document.getElementById('teacherName').value,
            totalOrig: getSafeNumber('totalOrig'),
            totalNew: getSafeNumber('totalNew'),
            totalEnd: getSafeNumber('totalEnd'),
            totalAdj: getSafeNumber('totalAdj'),
            totalTimeMove: document.getElementById('totalTimeMove').value || "無",
            totalLeave: document.getElementById('totalLeave').value.replace(/\s+/g, '') || "0", // 傳遞不化簡的原文字串
            totalTry: getSafeNumber('totalTry'),
            totalHours: getSafeNumber('totalHours'),
            memoNewStudents: document.getElementById('memoNewStudents').value || "無",
            memoGraduated: document.getElementById('memoGraduated').value || "無",
            memoAdjustments: document.getElementById('memoAdjustments').value || "無"
        };

        // 發送非同步請求至您的 Google Apps Script 後端
        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", // 使用不相交跨網域模式確保企業環境順暢
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            // 本地快取快照儲存（為了下一週自動繼承功能）
            const currentKey = `${payload.teacherName}_week_${payload.week}`;
            localDatabase[currentKey] = {
                totalOrig: payload.totalOrig,
                totalNew: payload.totalNew
            };
            localStorage.setItem('优儿週報快取', JSON.stringify(localDatabase));

            statusBox.style.background = "#d1fae5";
            statusBox.style.color = "#065f46";
            statusBox.innerText = `🎉 成功！第 ${payload.week} 週 ${payload.teacherName} 老師的數據已完美寫入人事月總表！`;
            
            // 送出成功後防呆自動清空
            setTimeout(() => { clearForm(false); }, 1000);
        })
        .catch(error => {
            statusBox.style.background = "#fee2e2";
            statusBox.style.color = "#991b1b";
            statusBox.innerText = "❌ 傳輸發生連線異常: " + error.toString();
        });
    }
</script>

</body>
</html>
