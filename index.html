<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優兒大腦開發 - 教學老師每週工作報表</title>
    <link class="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-size: 21px; }
        
        .header-banner { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 25px 15px; border-radius: 0 0 22px 22px; margin-bottom: 22px; box-shadow: 0 6px 9px rgba(0,0,0,0.05); }
        .header-banner h5 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0; }

        .card-custom { background: white; border-radius: 18px; border: 1px solid #e2e8f0; margin-bottom: 22px; padding: 22px; box-shadow: 0 3px 6px rgba(0,0,0,0.02); }
        .card-title-custom { font-size: 1.35rem; font-weight: bold; color: #1e3a8a; border-left: 6px solid #3b82f6; padding-left: 12px; margin-bottom: 20px; }
        
        .form-label { font-weight: 600; color: #334155; margin-bottom: 8px; }
        .form-control, .form-select { border-radius: 10px; border: 1px solid #cbd5e1; padding: 12px; font-size: 1.05rem; }
        .form-control:focus, .form-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        
        .day-btn { padding: 14px; font-weight: bold; border-radius: 12px; transition: all 0.2s; border: 1px solid #cbd5e1; background-color: white; color: #475569; }
        .day-btn.active { background-color: #1e3a8a !important; color: white !important; border-color: #1e3a8a; box-shadow: 0 4px 12px rgba(30,58,138,0.25); }
        
        .time-slot-box { border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 16px; background-color: #f8fafc; }
        .slot-title { font-weight: bold; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .status-badge { padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1; background-color: white; color: #64748b; transition: all 0.15s; user-select: none; }
        .status-badge.selected { background-color: #eff6ff; color: #2563eb; border-color: #bfdbfe; box-shadow: 0 2px 4px rgba(37,99,235,0.08); }
        
        .btn-primary-custom { background-color: #1e3a8a; color: white; font-weight: bold; border: none; border-radius: 12px; padding: 14px; width: 100%; transition: all 0.2s; box-shadow: 0 4px 6px rgba(30,58,138,0.15); }
        .btn-primary-custom:hover { background-color: #1d4ed8; }
        .btn-success-custom { background-color: #10b981; color: white; font-weight: bold; border: none; border-radius: 12px; padding: 16px; width: 100%; transition: all 0.2s; box-shadow: 0 4px 6px rgba(16,185,129,0.15); font-size: 1.2rem; }
        .btn-success-custom:hover { background-color: #059669; }
        
        .summary-value { font-weight: 2200; color: #1e3a8a; font-size: 1.4rem; }
        .review-note-box { background-color: #f1f5f9; padding: 12px; border-radius: 8px; margin-top: 8px; font-size: 1rem; border-left: 4px solid #94a3b8; }
        
        .counter-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #cbd5e1; background: white; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .counter-btn:active { background: #e2e8f0; }
        .counter-input { width: 70px; text-align: center; font-weight: bold; border: none; font-size: 1.2rem; background: transparent; }
        
        @media (max-width: 576px) {
            body { font-size: 18px; }
            .card-custom { padding: 16px; }
            .status-badge { padding: 6px 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="header-banner text-center">
        <h5>優兒大腦開發</h5>
        <div style="font-size: 0.95rem; opacity: 0.85; margin-top: 4px;">教學老師每週工作報表系統</div>
    </div>

    <div class="container" style="max-width: 720px;">
        <div class="card-custom">
            <div class="card-title-custom">填報基本資訊</div>
            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label">任課老師</label>
                    <select id="teacherName" class="form-select">
                        <option value="">請選擇老師</option>
                        <option value="黃曉萍">黃曉萍</option>
                        <option value="黃嘉綾">黃嘉綾</option>
                        <option value="蘇郁晶">蘇郁晶</option>
                        <option value="陳碧文">陳碧文</option>
                        <option value="林怡如">林怡如</option>
                        <option value="李靜婷">李靜婷</option>
                        <option value="陳佳吟">陳佳吟</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">月份與週數</label>
                    <select id="monthWeek" class="form-select">
                        </select>
                </div>
            </div>
        </div>

        <div class="card-custom">
            <div class="card-title-custom">選擇填寫星期</div>
            <div class="row g-2" id="dayTabsContainer">
                </div>
        </div>

        <div class="card-custom" id="dataFormCard">
            <div class="card-title-custom" id="currentDayTitle">星期數據填寫</div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3">
                    <div>
                        <span class="fw-bold">原學生人次</span>
                        <div class="text-muted" style="font-size:0.8rem;">上週既有穩定上課學童</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="counter-btn" onclick="changeCount('originalCount', -1)">-</button>
                        <input type="number" id="originalCount" class="counter-input" value="0" readonly>
                        <button class="counter-btn" onclick="changeCount('originalCount', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3">
                    <div>
                        <span class="fw-bold text-success">新加學生人次 (+)</span>
                        <div class="text-muted" style="font-size:0.8rem;">本週新開課或復課學生</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="counter-btn" onclick="changeCount('newCount', -1)">-</button>
                        <input type="number" id="newCount" class="counter-input" value="0" readonly>
                        <button class="counter-btn" onclick="changeCount('newCount', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3">
                    <div>
                        <span class="fw-bold text-danger">結業學生人次 (-)</span>
                        <div class="text-muted" style="font-size:0.8rem;">本週正式辦理結業離班學生</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="counter-btn" onclick="changeCount('gradCount', -1)">-</button>
                        <input type="number" id="gradCount" class="counter-input" value="0" readonly>
                        <button class="counter-btn" onclick="changeCount('gradCount', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3">
                    <div>
                        <span class="fw-bold text-primary">續課學生人次</span>
                        <div class="text-muted" style="font-size:0.8rem;">舊生期滿並成功繳費續課</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="counter-btn" onclick="changeCount('renewCount', -1)">-</button>
                        <input type="number" id="renewCount" class="counter-input" value="0" readonly>
                        <button class="counter-btn" onclick="changeCount('renewCount', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3">
                    <div>
                        <span class="fw-bold" style="color: #7c3aed;">學生上課時間調動</span>
                        <div class="text-muted" style="font-size:0.8rem;">轉換時段(原班扣除,新班增加)</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="counter-btn" onclick="changeCount('adjustReq', -1)">-</button>
                        <input type="number" id="adjustReq" class="counter-input" value="0" readonly>
                        <button class="counter-btn" onclick="changeCount('adjustReq', 1)">+</button>
                    </div>
                </div>
            </div>

            <hr>

            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label text-danger">請假學生人次 (-)</label>
                    <input type="number" id="leaveCount" class="form-control fw-bold fs-5" value="0" oninput="autoCalculateOutputs()">
                </div>
                <div class="col-6">
                    <label class="form-label text-warning">試上人次 (+)</label>
                    <input type="number" id="trialCount" class="form-control fw-bold fs-5" value="0" oninput="autoCalculateOutputs()">
                </div>
            </div>

            <div class="row g-3 mb-4 p-2 rounded-3" style="background-color: #f0fdf4;">
                <div class="col-6">
                    <label class="form-label text-secondary" style="font-size:0.9rem;">應上課學生人次</label>
                    <div id="shouldAttend" class="fw-bold fs-5 pt-1 text-dark">0 人</div>
                </div>
                <div class="col-6">
                    <label class="form-label text-success" style="font-size:0.9rem;">實際上課人次</label>
                    <div id="actualCount" class="fw-bold fs-4 pt-1 text-success">0 人</div>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label">老師應上時數</label>
                    <input type="number" id="teacherHours" class="form-control fw-bold" value="0" step="0.5">
                </div>
                <div class="col-6">
                    <label class="form-label">老師實上時數</label>
                    <input type="number" id="actualHours" class="form-control fw-bold" value="0" step="0.5">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-danger">● 請假學生姓名</label>
                <input type="text" id="dayLeaveNames" class="form-control" placeholder="請輸入請假學生姓名，無則留空">
            </div>
            <div class="mb-4">
                <label class="form-label text-primary">● 補課學生姓名</label>
                <input type="text" id="dayMakeupNames" class="form-control" placeholder="請輸入補課學生姓名，無則留空">
            </div>
            <div class="mb-4">
                <label class="form-label text-warning">● 試上學生姓名</label>
                <input type="text" id="dayTrialNames" class="form-control" placeholder="請輸入試上學生姓名，無則留空">
            </div>

            <div class="mb-4">
                <label class="form-label text-dark">🎯 當天開課時段與特殊異動紀錄 (複選)</label>
                <div id="timeSlotsContainer">
                    </div>
            </div>

            <button class="btn-primary-custom" onclick="saveCurrentDayData()">儲存目前星期數據</button>
        </div>

        <div class="card-custom">
            <div class="card-title-custom">全週綜合備註記事 (非必填)</div>
            <div class="mb-3">
                <label class="form-label">1. 全週新生入班記事</label>
                <textarea id="noteNewStudent" class="form-control" rows="2" placeholder="請輸入全週新入班兒童的學習適應狀況..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">2. 全週結業、續課與繳費記事</label>
                <textarea id="noteGradRenew" class="form-control" rows="2" placeholder="請輸入學生期滿、續課收費或辦理結業的特別說明..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">3. 全週時段調整與課程異動說明</label>
                <textarea id="noteTimeAdjust" class="form-control" rows="2" placeholder="請輸入學生因請假、調堂或時段永久轉班的紀錄..."></textarea>
            </div>
        </div>

        <div style="margin-bottom: 50px;">
            <button class="btn-success-custom" onclick="generateReview()">進入預覽與資料審核 ➔</button>
        </div>

        <div id="reviewBlock" class="card-custom" style="display: none; border: 3px solid #10b981; background-color: #fbfdfb;">
            <div class="card-title-custom text-success" style="border-left-color:#10b981;">⚠️ 請核對整週加總數據</div>
            
            <div class="row g-3 text-center mb-4 bg-white p-3 rounded-3 border">
                <div class="col-4 border-end mb-2">
                    <div class="text-muted" style="font-size:0.85rem;">原學生人次</div>
                    <div id="totalOriginal" class="summary-value">0</div>
                </div>
                <div class="col-4 border-end mb-2">
                    <div class="text-success" style="font-size:0.85rem;">新加學生</div>
                    <div id="totalNew" class="summary-value text-success">0</div>
                </div>
                <div class="col-4 mb-2">
                    <div class="text-danger" style="font-size:0.85rem;">結業學生</div>
                    <div id="totalGrad" class="summary-value text-danger">0</div>
                </div>
                <div class="col-4 border-end border-top pt-2">
                    <div class="text-primary" style="font-size:0.85rem;">續課學生</div>
                    <div id="totalRenew" class="summary-value text-primary">0</div>
                </div>
                <div class="col-4 border-end border-top pt-2">
                    <div style="color:#7c3aed; font-size:0.85rem;">時間調動</div>
                    <div id="totalAdjust" class="summary-value" style="color:#7c3aed;">0</div>
                </div>
                <div class="col-4 border-top pt-2">
                    <div class="text-dark" style="font-size:0.85rem;">應上課人次</div>
                    <div id="totalShould" class="summary-value text-dark">0</div>
                </div>
                <div class="col-4 border-end border-top pt-2">
                    <div class="text-danger" style="font-size:0.85rem;">請假人次</div>
                    <div id="totalLeave" class="summary-value text-danger">0</div>
                </div>
                <div class="col-4 border-end border-top pt-2">
                    <div class="text-success" style="font-size:0.85rem;">實際上課人次</div>
                    <div id="totalActual" class="summary-value text-success">0</div>
                </div>
                <div class="col-4 border-top pt-2">
                    <div class="text-warning" style="font-size:0.85rem;">試上人次</div>
                    <div id="totalTrial" class="summary-value text-warning">0</div>
                </div>
                <div class="col-6 border-end border-top pt-2">
                    <div class="text-secondary" style="font-size:0.85rem;">全週應上時數</div>
                    <div id="totalThour" class="summary-value text-secondary">0</div>
                </div>
                <div class="col-6 border-top pt-2">
                    <div class="text-secondary" style="font-size:0.85rem;">全週實上時數</div>
                    <div id="totalAhour" class="summary-value text-secondary">0</div>
                </div>
            </div>

            <div id="rvNotesBlock" class="mb-4"></div>

            <div class="row g-2">
                <div class="col-4">
                    <button class="btn btn-secondary w-100 py-3 fw-bold" onclick="backToEditForm()">返回修改</button>
                </div>
                <div class="col-8">
                    <button id="submitBtn" class="btn btn-success w-100 py-3 fw-bold fs-5" style="background-color:#10b981;" onclick="submitDataToCloud()">確認數據無誤<br>正式上傳雲端</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🚀 網址鎖定
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwhbfXseG08Sna2gud6DEWjhGz0LWOq4D-7wbURoKS0ul88taIdXu45xPt3c9_pHuiN/exec";

        const DAYS_LIST = ["週二", "週三", "週四", "週五", "週六"];
        // 💡 擴充時段清單：納入 6點、7點、8點 等清晨/早班時段
        const SLOTS_LIST = ["6-7", "7-8", "8-9", "9-10", "10-11", "11-12", "13-14", "14-15", "15-16", "16-17", "17-18", "18-19", "19-20", "20-21"];
        
        let currentDayIndex = 0;
        let weeklyData = [];
        let temporaryCachedData = null;

        // 初始化資料結構
        function initWeeklyData() {
            const cache = localStorage.getItem("weeklyReportData");
            if (cache) {
                try {
                    weeklyData = JSON.parse(cache);
                    return;
                } catch(e) { console.clear(); }
            }
            
            weeklyData = DAYS_LIST.map(day => ({
                day: day,
                originalCount: 0,
                newCount: 0,
                gradCount: 0,
                renewCount: 0,
                adjustReq: 0,
                leaveCount: 0,
                trialCount: 0,
                shouldAttend: 0,
                actualCount: 0,
                teacherHours: 0,
                actualHours: 0,
                dayLeaveNames: "",
                dayMakeupNames: "",
                dayTrialNames: "",
                timeSlots: SLOTS_LIST.map(s => ({ slot: s, status: [], detail: "" }))
            }));
        }

        window.onload = function() {
            buildMonthWeekOptions();
            initWeeklyData();
            renderDayTabs();
            renderTimeSlotsStructure();
            loadDayDataToForm(currentDayIndex);
        };

        function buildMonthWeekOptions() {
            const select = document.getElementById("monthWeek");
            const date = new Date();
            for(let i = 0; i < 2; i++) {
                let m = date.getMonth() + 1 + i;
                if(m > 12) m -= 12;
                ["第一週", "第二週", "第三週", "第四週", "第五週"].forEach(w => {
                    const opt = document.createElement("option");
                    opt.value = `${m}月 ${w}`;
                    opt.innerText = `${m}月 ${w}`;
                    select.appendChild(opt);
                });
            }
        }

        function renderDayTabs() {
            const container = document.getElementById("dayTabsContainer");
            container.innerHTML = "";
            DAYS_LIST.forEach((day, index) => {
                const col = document.createElement("div");
                col.className = "col";
                const btn = document.createElement("button");
                btn.className = `day-btn w-100 ${index === currentDayIndex ? 'active' : ''}`;
                btn.innerText = day;
                btn.onclick = () => switchDayTab(index);
                col.appendChild(btn);
                container.appendChild(col);
            });
        }

        function switchDayTab(targetIndex) {
            saveCurrentDayDataToMemory();
            currentDayIndex = targetIndex;
            renderDayTabs();
            loadDayDataToForm(currentDayIndex);
        }

        function changeCount(fieldId, amount) {
            const input = document.getElementById(fieldId);
            let val = parseInt(input.value) || 0;
            val += amount;
            if(val < 0) val = 0;
            input.value = val;
            autoCalculateOutputs();
        }

        function autoCalculateOutputs() {
            const orig = parseInt(document.getElementById("originalCount").value) || 0;
            const nCount = parseInt(document.getElementById("newCount").value) || 0;
            const gCount = parseInt(document.getElementById("gradCount").value) || 0;
            const lCount = parseInt(document.getElementById("leaveCount").value) || 0;
            const tCount = parseInt(document.getElementById("trialCount").value) || 0;
            
            const should = orig + nCount - gCount;
            const actual = should - lCount + tCount;
            
            document.getElementById("shouldAttend").innerText = `${should} 人`;
            document.getElementById("actualCount").innerText = `${actual} 人`;
        }

        function renderTimeSlotsStructure() {
            const container = document.getElementById("timeSlotsContainer");
            container.innerHTML = "";
            
            SLOTS_LIST.forEach((slot, sIdx) => {
                const box = document.createElement("div");
                box.className = "time-slot-box";
                box.innerHTML = `
                    <div class="slot-title">⏰ ${slot} 點時段</div>
                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <span class="status-badge" data-slot="${sIdx}" data-status="正常開課" onclick="toggleStatusBadge(this)">正常開課</span>
                        <span class="status-badge" data-slot="${sIdx}" data-status="請假:-1" onclick="toggleStatusBadge(this)">請假 (-1)</span>
                        <span class="status-badge" data-slot="${sIdx}" data-status="請假:-4" onclick="toggleStatusBadge(this)">請假 (-4)</span>
                        <span class="status-badge" data-slot="${sIdx}" data-status="補課:+1" onclick="toggleStatusBadge(this)">補課 (+1)</span>
                        <span class="status-badge" data-slot="${sIdx}" data-status="補課:+2" onclick="toggleStatusBadge(this)">補課 (+2)</span>
                        <span class="status-badge" data-slot="${sIdx}" data-status="試上:+1" onclick="toggleStatusBadge(this)">試上 (+1)</span>
                    </div>
                    <input type="text" id="slotDetail_${sIdx}" class="form-control form-control-sm" style="font-size:0.9rem;" placeholder="本時段異動學童姓名或特別備註...">
                `;
                container.appendChild(box);
            });
        }

        function toggleStatusBadge(el) {
            el.classList.toggle("selected");
        }

        function saveCurrentDayDataToMemory() {
            const idx = currentDayIndex;
            weeklyData[idx].originalCount = parseInt(document.getElementById("originalCount").value) || 0;
            weeklyData[idx].newCount = parseInt(document.getElementById("newCount").value) || 0;
            weeklyData[idx].gradCount = parseInt(document.getElementById("gradCount").value) || 0;
            weeklyData[idx].renewCount = parseInt(document.getElementById("renewCount").value) || 0;
            weeklyData[idx].adjustReq = parseInt(document.getElementById("adjustReq").value) || 0;
            weeklyData[idx].leaveCount = parseInt(document.getElementById("leaveCount").value) || 0;
            weeklyData[idx].trialCount = parseInt(document.getElementById("trialCount").value) || 0;
            
            weeklyData[idx].shouldAttend = parseInt(document.getElementById("shouldAttend").innerText) || 0;
            weeklyData[idx].actualCount = parseInt(document.getElementById("actualCount").innerText) || 0;
            
            weeklyData[idx].teacherHours = parseFloat(document.getElementById("teacherHours").value) || 0;
            weeklyData[idx].actualHours = parseFloat(document.getElementById("actualHours").value) || 0;
            
            weeklyData[idx].dayLeaveNames = document.getElementById("dayLeaveNames").value;
            weeklyData[idx].dayMakeupNames = document.getElementById("dayMakeupNames").value;
            weeklyData[idx].dayTrialNames = document.getElementById("dayTrialNames").value;

            SLOTS_LIST.forEach((slot, sIdx) => {
                const badges = document.querySelectorAll(`.status-badge[data-slot="${sIdx}"].selected`);
                const statuses = Array.from(badges).map(b => b.getAttribute("data-status"));
                const det = document.getElementById(`slotDetail_${sIdx}`).value;
                
                weeklyData[idx].timeSlots[sIdx] = { slot: slot, status: statuses, detail: det };
            });

            localStorage.setItem("weeklyReportData", JSON.stringify(weeklyData));
        }

        function saveCurrentDayData() {
            saveCurrentDayDataToMemory();
            alert(`✅ 【儲存成功】${DAYS_LIST[currentDayIndex]} 的數據已保存在本機網頁中！`);
        }

        function loadDayDataToForm(idx) {
            const day = weeklyData[idx];
            document.getElementById("currentDayTitle").innerText = `【${day.day}】核心教學數據填寫`;
            
            document.getElementById("originalCount").value = day.originalCount;
            document.getElementById("newCount").value = day.newCount;
            document.getElementById("gradCount").value = day.gradCount;
            document.getElementById("renewCount").value = day.renewCount;
            document.getElementById("adjustReq").value = day.adjustReq;
            document.getElementById("leaveCount").value = day.leaveCount;
            document.getElementById("trialCount").value = day.trialCount;
            
            document.getElementById("teacherHours").value = day.teacherHours;
            document.getElementById("actualHours").value = day.actualHours;
            
            document.getElementById("dayLeaveNames").value = day.dayLeaveNames || "";
            document.getElementById("dayMakeupNames").value = day.dayMakeupNames || "";
            document.getElementById("dayTrialNames").value = day.dayTrialNames || "";

            autoCalculateOutputs();

            SLOTS_LIST.forEach((slot, sIdx) => {
                const savedSlot = day.timeSlots[sIdx] || { status: [], detail: "" };
                const badges = document.querySelectorAll(`.status-badge[data-slot="${sIdx}"]`);
                badges.forEach(b => {
                    const statusText = b.getAttribute("data-status");
                    if (savedSlot.status && savedSlot.status.includes(statusText)) {
                        b.classList.add("selected");
                    } else {
                        b.classList.remove("selected");
                    }
                });
                document.getElementById(`slotDetail_${sIdx}`).value = savedSlot.detail || "";
            });
        }

        function generateReview() {
            const teacher = document.getElementById("teacherName").value;
            const monthWeek = document.getElementById("monthWeek").value;
            
            if(!teacher) { alert("⚠️ 請先選擇您的「任課老師姓名」！"); return; }
            
            saveCurrentDayDataToMemory();

            let tOrig = 0, tNew = 0, tGrad = 0, tRenew = 0, tAdj = 0, tShould = 0, tLeave = 0, tActual = 0, tTrial = 0, tThour = 0, tAhour = 0;
            let notesBlockHtml = "";

            weeklyData.forEach(day => {
                tOrig += day.originalCount;
                tNew += day.newCount;
                tGrad += day.gradCount;
                tRenew += day.renewCount;
                tAdj += day.adjustReq;
                tShould += day.shouldAttend;
                tLeave += day.leaveCount;
                tActual += day.actualCount;
                tTrial += day.trialCount;
                tThour += day.teacherHours;
                tAhour += day.actualHours;

                let daySlotsText = "";
                day.timeSlots.forEach(ts => {
                    if((ts.status && ts.status.length > 0) || ts.detail) {
                        // 💡 智慧翻譯：將後台結構代碼（如請假:-4）轉為中文易讀文字
                        let translatedStatus = ts.status.map(st => {
                            if(st === "正常開課") return "正常開課";
                            if(st === "請假:-1") return "請假 (-1人)";
                            if(st === "請假:-4") return "請假 (-4人)";
                            if(st === "補課:+1") return "補課 (+1人)";
                            if(st === "補課:+2") return "補課 (+2人)";
                            if(st === "試上:+1") return "試上 (+1人)";
                            return st;
                        }).join(", ");

                        daySlotsText += `<div style="padding-left:15px; font-size:0.95rem; margin-bottom: 3px;">• <b>${ts.slot} 點</b> ➔ <span class="badge bg-primary">${translatedStatus || "無狀態"}</span> ${ts.detail ? '<span class="text-secondary">(備註: ' + ts.detail + ')</span>' : ''}</div>`;
                    }
                });

                if(daySlotsText || day.dayLeaveNames || day.dayMakeupNames || day.dayTrialNames) {
                    notesBlockHtml += `
                        <div class="mt-3 p-2 bg-white rounded border">
                            <b class="text-primary" style="font-size:1.1rem;">📌 ${day.day} 明細與時段動態：</b>
                            ${day.dayLeaveNames ? `<div class="ms-2">🔴 請假兒童姓名：${day.dayLeaveNames}</div>` : ''}
                            ${day.dayMakeupNames ? `<div class="ms-2">🔵 補課兒童姓名：${day.dayMakeupNames}</div>` : ''}
                            ${day.dayTrialNames ? `<div class="ms-2">🟡 試上兒童姓名：${day.dayTrialNames}</div>` : ''}
                            ${daySlotsText ? `<div class="text-muted mt-2 ms-2" style="font-size:0.9rem;">🕒 時段動態詳情：</div>${daySlotsText}` : ''}
                        </div>`;
                }
            });

            document.getElementById("totalOriginal").innerText = tOrig + " 人";
            document.getElementById("totalNew").innerText = tNew + " 人";
            document.getElementById("totalGrad").innerText = tGrad + " 人";
            document.getElementById("totalRenew").innerText = tRenew + " 人";
            document.getElementById("totalAdjust").innerText = tAdj + " 人";
            document.getElementById("totalShould").innerText = tShould + " 人";
            document.getElementById("totalLeave").innerText = tLeave + " 人";
            document.getElementById("totalActual").innerText = tActual + " 人";
            document.getElementById("totalTrial").innerText = tTrial + " 人";
            document.getElementById("totalThour").innerText = tThour + " 小時";
            document.getElementById("totalAhour").innerText = tAhour + " 小時";

            temporaryCachedData = {
                teacher: teacher,
                monthWeek: monthWeek,
                noteNewStudent: document.getElementById("noteNewStudent").value,
                noteGradRenew: document.getElementById("noteGradRenew").value,
                noteTimeAdjust: document.getElementById("noteTimeAdjust").value
            };

            document.getElementById("reviewBlock").style.display = "block";
            
            let mainNotesText = "<h6 class='fw-bold text-dark mt-2'>📝 全週記事預覽：</h6>";
            if(temporaryCachedData.noteNewStudent) mainNotesText += `<div class="review-note-box">👶 <b>新生入班資訊：</b>${temporaryCachedData.noteNewStudent}</div>`;
            if(temporaryCachedData.noteGradRenew) mainNotesText += `<div class="review-note-box">🎓 <b>結業 / 續課姓名：</b>${temporaryCachedData.noteGradRenew}</div>`;
            if(temporaryCachedData.noteTimeAdjust) mainNotesText += `<div class="review-note-box">⚡ <b>姓名 / 上課時段調整資訊：</b>${temporaryCachedData.noteTimeAdjust}</div>`;
            
            document.getElementById('rvNotesBlock').innerHTML = mainNotesText + notesBlockHtml;
            document.getElementById('reviewBlock').scrollIntoView({ behavior: 'smooth' });
        }

        function backToEditForm() {
            document.getElementById('reviewBlock').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function submitDataToCloud() {
            if(!temporaryCachedData) return;
            
            const cleanNum = (id) => {
                const text = document.getElementById(id) ? document.getElementById(id).innerText : "0";
                return text.replace(/[^0-9.\-]/g, "") || "0";
            };

            const finalPayload = {
                teacher: temporaryCachedData.teacher,
                monthWeek: temporaryCachedData.monthWeek,
                
                totalOriginal: cleanNum('totalOriginal'),
                totalNew: cleanNum('totalNew'),
                totalGrad: cleanNum('totalGrad'),
                totalRenew: cleanNum('totalRenew'),
                totalAdjust: cleanNum('totalAdjust'),
                totalShould: cleanNum('totalShould'),
                totalLeave: cleanNum('totalLeave'),
                totalActual: cleanNum('totalActual'),
                totalTrial: cleanNum('totalTrial'),
                totalThour: cleanNum('totalThour'),
                totalAhour: cleanNum('totalAhour'),
                
                noteNewStudent: temporaryCachedData.noteNewStudent,
                noteGradRenew: temporaryCachedData.noteGradRenew,
                noteTimeAdjust: temporaryCachedData.noteTimeAdjust,
                
                weeklyData: weeklyData 
            };
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = "🚀 資料傳送中<br>請勿關閉網頁...";

            fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify(finalPayload),
                mode: "no-cors"
            })
            .then(() => {
                localStorage.removeItem("weeklyReportData");
                alert("🎉【上傳成功】每週報表已成功傳送至雲端試算表！網頁將重新載入。");
                window.location.reload();
            })
            .catch(err => {
                alert("❌ 傳送出現未知錯誤: " + err);
                btn.disabled = false;
                btn.innerHTML = "確認數據無誤<br>正式上傳雲端";
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
