<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優兒大腦開發 - 教學老師每週工作報表</title>
    <link class="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-size: 21px; }
        
        .header-banner { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 25px 15px; border-radius: 0 0 22px 22px; margin-bottom: 22px; box-shadow: 0 6px 9px rgba(0,0,0,0.05); }
        .header-banner h5 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0; }

        .card-custom { background: white; border-radius: 18px; border: 1px solid #e2e8f0; margin-bottom: 22px; padding: 22px; box-shadow: 0 3px 6px rgba(0,0,0,0.02); }
        .card-title-custom { font-size: 1.3rem; font-weight: bold; color: #1e3a8a; border-left: 6px solid #2563eb; padding-left: 10px; margin-bottom: 18px; }
        
        .form-label { font-weight: 600; color: #334155; font-size: 1.05rem; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 10px; padding: 10px 14px; border: 1px solid #cbd5e1; font-size: 1.05rem; }
        .form-control:focus, .form-select:focus { border-color: #357edd; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        
        .btn-custom-primary { background-color: #2563eb; color: white; font-weight: bold; border-radius: 12px; padding: 12px; border: none; font-size: 1.1rem; width: 100%; transition: all 0.2s; }
        .btn-custom-primary:hover { background-color: #1d4ed8; }
        .btn-custom-secondary { background-color: #f1f5f9; color: #475569; font-weight: bold; border-radius: 12px; padding: 12px; border: 1px solid #cbd5e1; font-size: 1.1rem; width: 100%; }
        
        .review-note-box { background-color: #f1f5f9; border-radius: 10px; padding: 10px 14px; font-size: 1rem; margin-bottom: 8px; }
        .student-item { background: #fdfdfd; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 0.95rem; }
        .field-desc { font-size: 0.85rem; color: #64748b; margin-top: 4px; display: block; font-style: italic; }
        
        .badge-student { font-size: 0.85rem; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        .bg-add { background-color: #d1fae5; color: #065f46; }
        .bg-leave { background-color: #fee2e2; color: #991b1b; }
        .bg-end { background-color: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div class="header-banner text-center">
        <h5>優兒大腦開發</h5>
        <div class="small opacity-75 mt-1">台南教學部 · 教師每週報表系統</div>
    </div>

    <div class="container mb-5">
        
        <div class="card-custom">
            <div class="card-title-custom">⚙️ 填報基礎設定</div>
            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label">選擇週別</label>
                    <select id="selectWeek" class="form-select" onchange="handleBaselineTrigger()">
                        <option value="">請選擇...</option>
                        <option value="1">第一週</option>
                        <option value="2">第二週</option>
                        <option value="3">第三週</option>
                        <option value="4">第四週</option>
                        <option value="5">第五週</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">老師姓名</label>
                    <select id="selectTeacher" class="form-select" onchange="handleBaselineTrigger()">
                        <option value="">請選擇...</option>
                        <option value="黃曉萍">黃曉萍</option>
                        <option value="黃嘉綾">黃嘉綾</option>
                        <option value="蘇郁晶">蘇郁晶</option>
                        <option value="林怡如">林怡如</option>
                        <option value="李靜婷">李靜婷</option>
                        <option value="陳佳玲">陳佳玲</option>
                        <option value="黃盈瑄">黃盈瑄</option>
                        <option value="陳碧文">陳碧文</option>
                        <option value="其他/代課">其他/代課</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">原學生人次 (本週基準)</label>
                    <input type="number" id="baseOrigStudents" class="form-control" placeholder="請輸入或由上週自動繼承">
                    <span id="inheritBadge" class="field-desc text-success d-none">✓ 已成功自動繼承上週的應上課學生人次！</span>
                </div>
            </div>
        </div>

        <div class="card-custom">
            <div class="card-title-custom">👥 學生異動與請假動態登錄</div>
            <div class="row g-2 mb-3">
                <div class="col-4">
                    <select id="studentType" class="form-select">
                        <option value="新加">新加</option>
                        <option value="結業">結業</option>
                        <option value="續課">續課</option>
                        <option value="請假/補課">請假/補課</option>
                    </select>
                </div>
                <div class="col-5">
                    <input type="text" id="studentName" class="form-control" placeholder="學生姓名">
                </div>
                <div class="col-3">
                    <button class="btn btn-dark w-100 h-100 rounded-3" onclick="addStudentLog()">+ 新增</button>
                </div>
            </div>
            
            <div id="studentLogsContainer" class="mb-2">
                <div class="text-muted text-center py-2 small">目前暫無登錄異動學員</div>
            </div>
        </div>

        <div class="card-custom">
            <div class="card-title-custom">📝 時數與時段調整備忘</div>
            <div class="mb-3">
                <label class="form-label">應上時數</label>
                <input type="number" id="inputHours" class="form-control" placeholder="請輸入本週應上總時數">
            </div>
            <div class="mb-3">
                <label class="form-label">試上人次</label>
                <input type="number" id="inputTryCount" class="form-control" placeholder="0" value="0">
            </div>
            <div class="mb-3">
                <label class="form-label">學生上課時間調整描述</label>
                <input type="text" id="inputTimeAdjust" class="form-control" placeholder="若無變更請填寫「無」">
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <button class="btn-custom-secondary" onclick="resetFormToDefault()">🧹 清空防呆</button>
            </div>
            <div class="col-6">
                <button class="btn-custom-primary" onclick="generateReviewSummary()">🔍 生成核對總表</button>
            </div>
        </div>

        <div id="reviewBlock" class="card-custom d-none" style="border: 2px solid #2563eb; background-color: #f8fafc;">
            <div class="card-title-custom text-primary">📊 人事報表最終數據核對</div>
            <div class="table-responsive">
                <table class="table table-bordered bg-white text-center small">
                    <thead class="table-secondary">
                        <tr>
                            <th>原學生</th><th>新加</th><th>結業</th><th>續課</th><th>應上課</th><th>請假軌跡</th><th>試上</th><th>應上時數</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="rvTableValues" class="fw-bold text-danger">
                            <td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="mt-3">
                <div class="fw-bold mb-2 small text-secondary">📋 系統自動彙整之三大重要備忘錄：</div>
                <div id="rvNotesBlock"></div>
            </div>
            
            <div class="mt-4">
                <button id="submitBtn" class="btn btn-success btn-lg w-100 fw-bold rounded-3 py-3" onclick="submitDataToCloud()">確認數據無誤，正式上傳雲端</button>
            </div>
        </div>

    </div>

    <script>
        // 🌟 核心網址配置
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw9F0S.../exec"; 

        let studentLogs = [];
        const localCacheDB = JSON.parse(localStorage.getItem('YuoErTeacherAppCache') || '{}');
        let temporaryCachedData = null;

        // 1. 歷史承接繼承邏輯
        function handleBaselineTrigger() {
            const week = document.getElementById('selectWeek').value;
            const teacher = document.getElementById('selectTeacher').value;
            const badge = document.getElementById('inheritBadge');
            
            badge.classList.add('d-none');
            if(!week || !teacher || week === "1") return;

            const prevWeekKey = `${teacher}_W${parseInt(week) - 1}`;
            if(localCacheDB[prevWeekKey]) {
                document.getElementById('baseOrigStudents').value = localCacheDB[prevWeekKey].calculatedShouldAttend;
                badge.classList.remove('d-none');
            }
        }

        // 2. 異動登錄清單操作
        function addStudentLog() {
            const type = document.getElementById('studentType').value;
            const name = document.getElementById('studentName').value.trim();
            if(!name) { alert("❌ 請先輸入學員姓名"); return; }

            studentLogs.push({ type, name });
            document.getElementById('studentName').value = "";
            renderStudentLogs();
        }

        function removeStudentLog(index) {
            studentLogs.splice(index, 1);
            renderStudentLogs();
        }

        function renderStudentLogs() {
            const container = document.getElementById('studentLogsContainer');
            if(studentLogs.length === 0) {
                container.innerHTML = '<div class="text-muted text-center py-2 small">目前暫無登錄異動學員</div>';
                return;
            }

            let html = "";
            studentLogs.forEach((log, index) => {
                let badgeClass = "bg-add";
                if(log.type === "結業") badgeClass = "bg-end";
                if(log.type === "請假/補課") badgeClass = "bg-leave";
                if(log.type === "續課") badgeClass = "bg-add";

                html += `
                    <div class="student-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge-student ${badgeClass} me-2">${log.type}</span>
                            <strong>${log.name}</strong>
                        </div>
                        <button class="btn btn-sm btn-outline-danger border-0" onclick="removeStudentLog(${index})">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 3. 🧹 清空防呆
        function resetFormToDefault() {
            if(!confirm("您確定要完全清空目前輸入的所有報表欄位嗎？")) return;
            document.getElementById('selectWeek').value = "";
            document.getElementById('selectTeacher').value = "";
            document.getElementById('baseOrigStudents').value = "";
            document.getElementById('inputHours').value = "";
            document.getElementById('inputTryCount').value = "0";
            document.getElementById('inputTimeAdjust').value = "";
            studentLogs = [];
            renderStudentLogs();
            document.getElementById('reviewBlock').classList.add('d-none');
            document.getElementById('inheritBadge').classList.add('d-none');
        }

        // 4. 🔍 生成與動態算式解析（完美彙整三大人事專用備忘錄）
        function generateReviewSummary() {
            const week = document.getElementById('selectWeek').value;
            const teacher = document.getElementById('selectTeacher').value;
            const baseOrig = parseInt(document.getElementById('baseOrigStudents').value) || 0;
            const hours = parseFloat(document.getElementById('inputHours').value) || 0;
            const tryCount = parseInt(document.getElementById('inputTryCount').value) || 0;
            const timeAdjust = document.getElementById('inputTimeAdjust').value.trim() || "無";

            if(!week || !teacher) { alert("❌ 請確認填寫了「週別」與「老師姓名」"); return; }

            // 統計各人次數量
            let cNew = 0, cEnd = 0, cAdj = 0;
            let arrNew = [], arrEnd = [], arrAdj = [], arrLeaveAdd = [], arrLeaveSub = [];

            studentLogs.forEach(log => {
                if(log.type === "新加") { cNew++; arrNew.push(log.name); }
                if(log.type === "結業") { cEnd++; arrEnd.push(log.name); }
                if(log.type === "續課") { cAdj++; arrAdj.push(log.name); }
                if(log.type === "請假/補課") {
                    if(log.name.includes('-')) { arrLeaveSub.push(log.name); }
                    else { arrLeaveAdd.push(log.name); }
                }
            });

            // 🌟 請假自動轉化為人事加減軌跡算式
            let leaveFormula = "0";
            if(arrLeaveAdd.length > 0 || arrLeaveSub.length > 0) {
                let parts = [];
                if(arrLeaveAdd.length > 0) parts.push(`+${arrLeaveAdd.length}`);
                if(arrLeaveSub.length > 0) parts.push(`-${arrLeaveSub.length}`);
                leaveFormula = parts.join("");
            }

            const shouldAttend = baseOrig + cNew;

            // 封裝與後端新欄位咬合的資料結構
            temporaryCachedData = {
                week: week,
                teacherName: teacher,
                totalOrig: baseOrig,
                totalNew: cNew,
                totalEnd: cEnd,
                totalAdj: cAdj,
                totalTimeMove: timeAdjust, // 修正：對齊後端第6欄位 Key
                totalLeave: leaveFormula,  // 修正：傳遞原始算式字串
                totalTry: tryCount,
                totalHours: hours,
                memoNewStudents: arrNew.length > 0 ? `新加(${arrNew.length}人): ${arrNew.join("、")}` : "無",
                memoGraduated: arrEnd.length > 0 || arrAdj.length > 0 ? `結業: ${arrEnd.join("、") || "無"}；續課: ${arrAdj.join("、") || "無"}` : "無",
                memoAdjustments: timeAdjust !== "無" ? `時段調整記事: ${timeAdjust}` : "無",
                calculatedShouldAttend: shouldAttend
            };

            // 渲染至核對區
            const tds = document.getElementById('rvTableValues').getElementsByTagName('td');
            tds[0].innerText = temporaryCachedData.totalOrig;
            tds[1].innerText = temporaryCachedData.totalNew;
            tds[2].innerText = temporaryCachedData.totalEnd;
            tds[3].innerText = temporaryCachedData.totalAdj;
            tds[4].innerText = temporaryCachedData.calculatedShouldAttend;
            tds[5].innerText = temporaryCachedData.totalLeave;
            tds[6].innerText = temporaryCachedData.totalTry;
            tds[7].innerText = temporaryCachedData.totalHours;

            // 三大備忘錄顯示
            let notesHtml = `
                <div class="review-note-box">👶 <b>新生記事：</b>${temporaryCachedData.memoNewStudents}</div>
                <div class="review-note-box">🎓 <b>結業續課：</b>${temporaryCachedData.memoGraduated}</div>
                <div class="review-note-box">⚡ <b>時段調整：</b>${temporaryCachedData.totalTimeMove}</div>
            `;
            
            // 請假名單細節補充
            if(arrLeaveAdd.length > 0 || arrLeaveSub.length > 0) {
                notesHtml += `<div class="review-note-box text-danger">ℹ️ <b>請假登錄明細：</b>補課/新增人次(${arrLeaveAdd.join("、") || "無"}) ； 請假/扣除人次(${arrLeaveSub.join("、") || "無"})</div>`;
            }

            document.getElementById('rvNotesBlock').innerHTML = notesHtml;
            document.getElementById('reviewBlock').classList.remove('d-none');
            document.getElementById('reviewBlock').scrollIntoView({ behavior: 'smooth' });
        }

        // 5. 🚀 正式上傳
        function submitDataToCloud() {
            if(!temporaryCachedData) { alert("❌ 請先生成上方數據總表進行核對。"); return; }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "🚀 資料傳送中，請絕對不要關閉網頁...";

            fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify(temporaryCachedData),
                mode: "no-cors"
            })
            .then(() => {
                // 快照本週應上課數據，以便下週進行自動繼承
                const cacheKey = `${temporaryCachedData.teacherName}_W${temporaryCachedData.week}`;
                localCacheDB[cacheKey] = { calculatedShouldAttend: temporaryCachedData.calculatedShouldAttend };
                localStorage.setItem('YuoErTeacherAppCache', JSON.stringify(localCacheDB));

                alert("🎉【上傳成功】每週報表已成功傳送至雲端試算表！網頁將重新載入。");
                window.location.reload();
            })
            .catch(err => {
                alert("❌ 傳送出現未知錯誤: " + err);
                btn.disabled = false;
                btn.textContent = "確認數據無誤，正式上傳雲端";
            });
        }
    </script>
</body>
</html>
