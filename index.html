<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優兒台南教學部-週報表填報系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            margin: 0 auto;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        label {
            display: block;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        /* 備忘錄區塊框樣式 */
        .memo-box {
            border: 1px solid #dcdde1;
            padding: 15px;
            border-radius: 6px;
            background-color: #f9f9f9;
            margin-top: 15px;
        }
        .memo-title {
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 10px;
            font-size: 14px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 5px;
        }
        textarea {
            height: 60px;
            resize: vertical;
        }
        /* 提示字樣式 */
        .preview-text {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .inherit-text {
            font-size: 11px;
            color: #27ae60;
            margin-top: 4px;
            display: none;
        }
        /* 按鈕視覺 */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit {
            background-color: #3498db;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .btn-clear {
            background-color: #e74c3c;
        }
        .btn-clear:hover {
            background-color: #c0392b;
        }
        #statusMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>優兒台南教學部-週報表填報系統</h2>
    
    <form id="weeklyReportForm" onsubmit="sendDataToGAS(event)">
        
        <div class="form-row">
            <div class="form-group">
                <label for="week">選擇填報週別</label>
                <select id="week" required onchange="checkAndInheritData()">
                    <option value="">-- 請選擇週別 --</option>
                    <option value="1">第一週</option>
                    <option value="2">第二週</option>
                    <option value="3">第三週</option>
                    <option value="4">第四週</option>
                    <option value="5">第五週</option>
                </select>
            </div>
            <div class="form-group">
                <label for="teacherName">老師姓名</label>
                <select id="teacherName" required onchange="checkAndInheritData()">
                    <option value="">-- 請選擇老師 --</option>
                    <option value="黃曉萍">黃曉萍</option>
                    <option value="黃嘉綾">黃嘉綾</option>
                    <option value="蘇郁晶">蘇郁晶</option>
                    <option value="林怡如">林怡如</option>
                    <option value="李靜婷">李靜婷</option>
                    <option value="陳佳玲">陳佳玲</option>
                    <option value="黃盈瑄">黃盈瑄</option>
                    <option value="陳碧文">陳碧文</option>
                    <option value="其他/代課">其他/代課</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="totalOrig">原學生人次</label>
                <input type="text" id="totalOrig" placeholder="0" oninput="liveCalculate()">
                <div id="inheritAlert" class="inherit-text">💡 已為您精準繼承上週應上課人次！</div>
            </div>
            <div class="form-group">
                <label for="totalNew">新加學生人次</label>
                <input type="text" id="totalNew" placeholder="0" oninput="liveCalculate()">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="totalEnd">結業學生人次</label>
                <input type="text" id="totalEnd" placeholder="0">
            </div>
            <div class="form-group">
                <label for="totalAdj">續課學生人次</label>
                <input type="text" id="totalAdj" placeholder="0">
            </div>
        </div>

        <div class="form-group">
            <label for="totalTimeMove">學生上課時間調整</label>
            <input type="text" id="totalTimeMove" placeholder="例如：無、或特定學生改時段">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="totalLeave">請假/補課學生人次</label>
                <input type="text" id="totalLeave" placeholder="0" oninput="liveCalculate()">
                <div id="leaveCalcPreview" class="preview-text">目前運算解析：0 人次</div>
            </div>
            <div class="form-group">
                <label for="totalTry">試上人次</label>
                <input type="text" id="totalTry" placeholder="0">
            </div>
        </div>

        <div class="form-group">
            <label for="totalHours">應上時數</label>
            <input type="text" id="totalHours" placeholder="0">
        </div>

        <div class="memo-box">
            <div class="memo-title">📌 1. 新生姓名與詳細記事</div>
            <textarea id="memoNewStudents" placeholder="請輸入本週新加學生的姓名與上課狀況..."></textarea>
        </div>

        <div class="memo-box">
            <div class="memo-title">📌 2. 結業 / 期數 / 續課學生姓名記事</div>
            <textarea id="memoGraduated" placeholder="請輸入本週結業、續課學生的姓名與期數..."></textarea>
        </div>

        <div class="memo-box">
            <div class="memo-title">📌 3. 姓名 / 上課時段變更詳細調動資訊</div>
            <textarea id="memoAdjustments" placeholder="請詳細記錄本週調整上課時間的學生姓名與新舊時段..."></textarea>
        </div>

        <div id="statusMessage"></div>

        <div class="btn-group">
            <button type="button" class="btn-clear" onclick="resetForm防呆(true)">🧹 清空防呆</button>
            <button type="submit" class="btn-submit">🚀 精準送出</button>
        </div>
    </form>
</div>

<script>
    // 🌟 您的 GAS Web App 的正式網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw9F0S.../exec"; 

    // 本地跨週快取暫存（支援上週應上自動繼承功能）
    const weekCacheDB = JSON.parse(localStorage.getItem('YuoErWeekCacheData') || '{}');

    // 1. 安全解析虛擬 0 Placeholder (忽略空格)
    function cleanAndGetNum(id) {
        const inputVal = document.getElementById(id).value.replace(/\s+/g, '');
        if (!inputVal) return 0;
        const num = parseFloat(inputVal);
        return isNaN(num) ? 0 : num;
    }

    // 2. 核心功能：動態請假算式解析 (+2-4)
    function parseFormulaString(str) {
        const cleanStr = str.replace(/\s+/g, ''); // 忽略空格
        if (!cleanStr) return 0;
        if (!/^[0-9+\-]+$/.test(cleanStr)) return 0; // 只接受數字與加減號
        try {
            return Function(`return (${cleanStr})`)();
        } catch {
            return 0;
        }
    }

    // 3. 即時打字即時運算
    function liveCalculate() {
        const orig = cleanAndGetNum('totalOrig');
        const xnew = cleanAndGetNum('totalNew');
        const shouldAttend = orig + xnew;
        
        const leaveText = document.getElementById('totalLeave').value;
        const leaveParsed = parseFormulaString(leaveText);
        
        const previewBox = document.getElementById('leaveCalcPreview');
        previewBox.innerText = `目前運算解析：${leaveParsed >= 0 ? '+' : ''}${leaveParsed} 人次`;
    }

    // 4. 🌟 核心神級功能：上週應上自動繼承至本週原學
    function checkAndInheritData() {
        const chosenWeek = document.getElementById('week').value;
        const chosenTeacher = document.getElementById('teacherName').value;
        const alertDiv = document.getElementById('inheritAlert');
        
        alertDiv.style.display = 'none';
        if (!chosenWeek || !chosenTeacher || chosenWeek === "1") return; // 第一週不用繼承
        
        const lastWeekNum = (parseInt(chosenWeek) - 1).toString();
        const searchKey = `${chosenTeacher}_W${lastWeekNum}`;
        
        if (weekCacheDB[searchKey]) {
            const prevOrig = parseFloat(weekCacheDB[searchKey].totalOrig) || 0;
            const prevNew = parseFloat(weekCacheDB[searchKey].totalNew) || 0;
            const targetInheritValue = prevOrig + prevNew; // 上週的應上課人次總和
            
            document.getElementById('totalOrig').value = targetInheritValue;
            alertDiv.style.display = 'block';
            liveCalculate();
        }
    }

    // 5. 🧹 表單清空防呆機制
    function resetForm防呆(isUserClick) {
        if (isUserClick && !confirm("您確定要完全清空目前畫面上輸入的所有資料嗎？")) return;
        document.getElementById('weeklyReportForm').reset();
        document.getElementById('leaveCalcPreview').innerText = "目前運算解析：0 人次";
        document.getElementById('inheritAlert').style.display = 'none';
    }

    // 6. 🚀 非同步送出資料包
    function sendDataToGAS(e) {
        e.preventDefault();
        
        const msgBox = document.getElementById('statusMessage');
        msgBox.style.display = "block";
        msgBox.style.backgroundColor = "#e1f5fe";
        msgBox.style.color = "#0288d1";
        msgBox.innerText = "⏳ 正在校對欄位並精準發送至人事月總表...";

        const payload = {
            week: document.getElementById('week').value,
            teacherName: document.getElementById('teacherName').value,
            totalOrig: cleanAndGetNum('totalOrig'),
            totalNew: cleanAndGetNum('totalNew'),
            totalEnd: cleanAndGetNum('totalEnd'),
            totalAdj: cleanAndGetNum('totalAdj'),
            totalTimeMove: document.getElementById('totalTimeMove').value || "無",
            totalLeave: document.getElementById('totalLeave').value.replace(/\s+/g, '') || "0", // 完美保留字串軌跡
            totalTry: cleanAndGetNum('totalTry'),
            totalHours: cleanAndGetNum('totalHours'),
            memoNewStudents: document.getElementById('memoNewStudents').value || "無",
            memoGraduated: document.getElementById('memoGraduated').value || "無",
            memoAdjustments: document.getElementById('memoAdjustments').value || "無"
        };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            // 將此週的數據快存入瀏覽器快取，以便下一週繼承
            const currentCacheKey = `${payload.teacherName}_W${payload.week}`;
            weekCacheDB[currentCacheKey] = {
                totalOrig: payload.totalOrig,
                totalNew: payload.totalNew
            };
            localStorage.setItem('YuoErWeekCacheData', JSON.stringify(weekCacheDB));

            msgBox.style.backgroundColor = "#d4edda";
            msgBox.style.color = "#155724";
            msgBox.innerText = `🎉 成功！第 ${payload.week} 週 ${payload.teacherName} 老師的週報數據已精準連動！`;
            
            setTimeout(() => {
                resetForm防呆(false);
                msgBox.style.display = "none";
            }, 1200);
        })
        .catch(err => {
            msgBox.style.backgroundColor = "#f8d7da";
            msgBox.style.color = "#721c24";
            msgBox.innerText = "❌ 發送失敗，請檢查網路連線或 GAS 網址: " + err.toString();
        });
    }
</script>

</body>
</html>
