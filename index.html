<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優兒大腦開發 - 教學老師每週工作報表</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-size: 21px; }
        
        .header-banner { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 30px 15px; border-radius: 0 0 22px 22px; margin-bottom: 22px; box-shadow: 0 6px 9px rgba(0,0,0,0.05); }
        .header-banner h5 { font-size: 1.8rem; font-weight: bold; }
        .header-banner p { font-size: 1.1rem; }

        .card-custom { background: white; border-radius: 18px; border: 1px solid #e2e8f0; margin-bottom: 22px; padding: 22px; box-shadow: 0 3px 6px rgba(0,0,0,0.02); }
        .day-header { background-color: #e2e8f0; color: #1e3a8a; font-weight: bold; padding: 15px; border-radius: 12px; cursor: pointer; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
        .section-title { font-size: 22px; font-weight: bold; color: #1e3a8a; border-left: 6px solid #2563eb; padding-left: 12px; margin-bottom: 18px; }
        
        /* 💡 重新精雕細琢的標籤區塊排版：完美復刻 image.png 的對稱美感 */
        .grid-label-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 64px; /* 固定的起跑線高度 */
            margin-bottom: 6px;
        }

        .grid-label { 
            font-size: 18px; 
            font-weight: bold; 
            color: #475569; 
            line-height: 1.2;
            display: block;
            width: 100%;
        }

        /* 💡 6字項目核心優化：比照 image.png 效果，上4字、下2字且左右拉開分散置中 */
        .label-6char-container {
            display: block;
            text-align: center;
            width: 100%;
        }
        .label-6char-top {
            display: block;
            letter-spacing: -0.5px;
            margin-bottom: 1px;
        }
        .label-6char-bottom {
            display: block;
            text-align: justify;
            text-align-last: justify; /* 💡 左右分散對齊魔法：讓「人次」或「時數」完美向兩側撐開對齊上排 */
            padding: 0 12px;          /* 精細控制縮排，使其完美對稱 */
        }

        /* 5個字的項目自然置中微調 */
        .label-5char {
            display: block;
            text-align: center;
            white-space: nowrap;
        }
        
        /* 常規4字標籤也同步居中，畫面會更整齊 */
        .label-center {
            text-align: center;
        }
        
        /* 強制所有輸入框、下拉選單保持一模一樣的高度 */
        .form-control, .form-select { font-size: 20px; padding: 10px 15px; border-radius: 10px; height: 55px; }
        .form-control-sm { font-size: 19px; padding: 8px 12px; height: 55px; }

        .btn-submit { background: linear-gradient(135deg, #16a34a, #15803d); color: white; font-weight: bold; padding: 20px; width: 100%; border: none; border-radius: 15px; font-size: 24px; box-shadow: 0 6px 15px rgba(22,163,74,0.15); }
        
        .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.92); z-index:9999; justify-content: center; align-items: center; flex-direction: column; font-size: 24px; }
        
        /* 🕒 時段區塊 */
        .ts-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            width: 100%;
        }
        .ts-label {
            display: block;
            width: 100%;
        }
        .ts-checkbox { display: none; }
        .ts-badge { 
            display: block; 
            width: 100%;
            text-align: center;
            background-color: #f1f5f9; 
            border: 1px solid #cbd5e1; 
            border-radius: 9px; 
            padding: 12px 0; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ts-checkbox:checked + .ts-badge { background-color: #3b82f6; color: white; border-color: #2563eb; }
        
        .day-body-content { display: none; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <div class="mt-3 fw-bold text-secondary" id="loadingText">智慧報表系統加載中...</div>
    </div>

    <div class="header-banner text-center">
        <h5 class="mb-1">教學老師每週工作報表</h5>
    </div>

    <div class="container mb-5" style="max-width: 750px;">
        <form id="weeklyForm">
            
            <!-- 頂部基本欄位 -->
            <div class="card-custom">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label fw-bold" style="font-size: 18px;">月份 / 週數 </label>
                        <select class="form-select" id="monthWeek" required style="height: 55px;">
                            <option value="">請選擇週數</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold" style="font-size: 18px;">任課老師</label>
                        <select class="form-select" id="teacher" required style="height: 55px;">
                            <option value="">載入中...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section-title">📅 每日課堂人數與時段填報 (週二至週六)</div>

            <!-- 動態生成週二到週六的卡片區塊 -->
            <div id="daysContainer"></div>

            <!-- 底部重要記事區 -->
            <div class="card-custom">
                <div class="section-title">📝 重要記事欄位</div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">新生姓名</label>
                    <input type="text" class="form-control" id="noteNewStudent" placeholder="請輸入新生姓名">
                </div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">結業姓名 / 期數 / 續課姓名</label>
                    <textarea class="form-control" id="noteGradRenew" rows="2" placeholder="請輸入結業與續課資訊" style="height: auto;"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">補課姓名 / 補課時段</label>
                    <input type="text" class="form-control" id="noteMakeup" placeholder="如: 王小明 (週三 2-3)">
                </div>
                
                <div class="mb-3">
                    <label class="form-label grid-label">姓名 / 時段調整</label>
                    <input type="text" class="form-control" id="noteTimeAdjust" placeholder="如: 李小美 調整至 4-5">
                </div>
            </div>

            <button type="submit" class="btn-submit mb-4" id="submitBtn">確認提交整週雲端報表</button>
        </form>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwhbfXseG08Sna2gud6DEWjhGz0LWOq4D-7wbURoKS0ul88taIdXu45xPt3c9_pHuiN/exec";
        
        const overlay = document.getElementById('loadingOverlay');
        const daysContainer = document.getElementById('daysContainer');

        window.addEventListener('DOMContentLoaded', () => {
            overlay.style.display = 'flex';
            generateMonthWeekOptions();
            
            const script = document.createElement('script');
            script.src = `${GAS_API_URL}?callback=initWeeklyForm`;
            document.body.appendChild(script);
        });

        function generateMonthWeekOptions() {
            const select = document.getElementById('monthWeek');
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const nextMonth = currentMonth === 12 ? 1 : currentMonth + 1;
            
            const weeks = ["第一週", "第二週", "第三週", "第四週", "第五週"];
            
            let html = '<option value="">請選擇週數</option>';
            weeks.forEach(w => html += `<option value="${currentMonth}月 ${w}">${currentMonth}月 ${w}</option>`);
            weeks.forEach(w => html += `<option value="${nextMonth}月 ${w}">${nextMonth}月 ${w}</option>`);
            
            select.innerHTML = html;
        }

        function initWeeklyForm(config) {
            const teacherSelect = document.getElementById('teacher');
            let tHtml = '<option value="">請選擇老師</option>';
            config.teachers.forEach(t => tHtml += `<option value="${t}">${t}</option>`);
            teacherSelect.innerHTML = tHtml;

            let daysHtml = '';
            const dayTargetIndex = [2, 3, 4, 5, 6]; 

            config.days.forEach((day, index) => {
                daysHtml += `
                <div class="card-custom border-primary">
                    <div class="day-header" onclick="toggleCollapse('box_${index}')">
                        <span>📌 ${day} 工作報表</span>
                        <span class="small text-secondary" style="font-size: 16px;">點擊展開 ▽</span>
                    </div>
                    <div id="box_${index}" class="day-body-content" style="display: none;">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="grid-label-wrapper" style="height:auto;">
                                    <label class="grid-label text-primary">選擇正確日期 (對應${day})</label>
                                </div>
                                <input type="date" class="form-control form-control-sm persistent" id="date_${index}">
                            </div>
                            
                            <!-- 原學生人次 (5字) -->
                            <div class="col-4 mt-2">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-5char">原學生人次</label>
                                </div>
                                <input type="number" class="form-control form-control-sm calc-val persistent" id="orig_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 新加學生人次 (6字 -> 4/2 分散對齊) -->
                            <div class="col-4 mt-2">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">新加學生</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="number" class="form-control form-control-sm calc-val persistent" id="new_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 結業學生人次 (6字 -> 4/2 分散對齊) -->
                            <div class="col-4 mt-2">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">結業學生</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="number" class="form-control form-control-sm calc-val persistent" id="grad_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 續課學生人次 (6字 -> 4/2 分散對齊) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">續課學生</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="number" class="form-control form-control-sm calc-val persistent" id="renew_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 上課調整 (4字) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-center">上課調整</label>
                                </div>
                                <input type="text" class="form-control form-control-sm persistent" id="adj_${index}" placeholder="無">
                            </div>
                            
                            <!-- 應上課人次 (5字) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label text-primary label-5char">應上課人次</label>
                                </div>
                                <input type="number" class="form-control form-control-sm bg-light text-primary fw-bold" id="should_${index}" placeholder="0" readonly step="0.1">
                            </div>
                            
                            <!-- 請假人次 (4字) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-center">請假人次</label>
                                </div>
                                <input type="number" class="form-control form-control-sm calc-val persistent" id="leave_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 實際上課人次 (6字 -> 4/2 分散對齊) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label text-success label-6char-container">
                                        <span class="label-6char-top">實際上課</span>
                                        <span class="label-6char-bottom">人次</span>
                                    </label>
                                </div>
                                <input type="number" class="form-control form-control-sm bg-light text-success fw-bold" id="actual_${index}" placeholder="0" readonly step="0.1">
                            </div>
                            
                            <!-- 試上人數 (4字) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-center">試上人數</label>
                                </div>
                                <input type="number" class="form-control form-control-sm persistent" id="trial_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 老師應上時數 (6字 -> 4/2 分散對齊) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">老師應上</span>
                                        <span class="label-6char-bottom">時數</span>
                                    </label>
                                </div>
                                <input type="number" class="form-control form-control-sm persistent" id="thour_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <!-- 實際上課時數 (6字 -> 4/2 分散對齊) -->
                            <div class="col-4">
                                <div class="grid-label-wrapper">
                                    <label class="grid-label label-6char-container">
                                        <span class="label-6char-top">實際上課</span>
                                        <span class="label-6char-bottom">時數</span>
                                    </label>
                                </div>
                                <input type="number" class="form-control form-control-sm persistent" id="ahour_${index}" placeholder="0" min="0" step="0.1">
                            </div>
                            
                            <div class="col-12">
                                <label class="grid-label">請假姓名</label>
                                <input type="text" class="form-control form-control-sm persistent" id="leavename_${index}" placeholder="請輸入請假學生姓名" style="height: 55px;">
                            </div>
                            <div class="col-12 mt-2">
                                <label class="grid-label d-block">🕒 跟課時段 (4欄固定格式)</label>
                                <div class="ts-container">
                                    ${config.timeSlots.map(ts => `
                                        <label class="ts-label">
                                            <input type="checkbox" class="ts-checkbox persistent-cb" name="ts_${index}" value="${ts}" data-day="${index}">
                                            <span class="ts-badge">${ts}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            daysContainer.innerHTML = daysHtml;
            setupCalcLogic(config.days.length);
            setupPersistence(); 
            overlay.style.display = 'none';
        }

        function toggleCollapse(id) {
            const el = document.getElementById(id);
            if (el.style.display === 'none' || el.style.display === '') {
                el.style.display = 'block';
            } else {
                el.style.display = 'none';
            }
        }

        function setupCalcLogic(daysCount) {
            for(let i=0; i<daysCount; i++) {
                const inputs = [`orig_${i}`, `new_${i}`, `grad_${i}`, `renew_${i}`, `leave_${i}`];
                inputs.forEach(id => {
                    document.getElementById(id).addEventListener('input', () => {
                        calculateRow(i);
                    });
                });
            }
        }

        function calculateRow(i) {
            const orig = parseFloat(document.getElementById(`orig_${i}`).value) || 0;
            const n = parseFloat(document.getElementById(`new_${i}`).value) || 0;
            const g = parseFloat(document.getElementById(`grad_${i}`).value) || 0;
            const r = parseFloat(document.getElementById(`renew_${i}`).value) || 0;
            const leave = parseFloat(document.getElementById(`leave_${i}`).value) || 0;

            let should = orig + n - g;
            if(should < 0) should = 0;
            document.getElementById(`should_${i}`).value = should % 1 === 0 ? should : should.toFixed(1);

            let actual = should - leave;
            if(actual < 0) actual = 0;
            document.getElementById(`actual_${i}`).value = actual % 1 === 0 ? actual : actual.toFixed(1);
        }

        function setupPersistence() {
            const basicInputs = ['monthWeek', 'teacher', 'noteNewStudent', 'noteGradRenew', 'noteMakeup', 'noteTimeAdjust'];
            basicInputs.forEach(id => {
                const el = document.getElementById(id);
                if(localStorage.getItem(id)) el.value = localStorage.getItem(id);
                el.addEventListener('input', () => localStorage.setItem(id, el.value));
            });

            document.querySelectorAll('.persistent').forEach(input => {
                if(localStorage.getItem(input.id)) {
                    input.value = localStorage.getItem(input.id);
                }
                input.addEventListener('input', () => {
                    localStorage.setItem(input.id, input.value);
                    if(input.classList.contains('calc-val')) {
                        const idx = input.id.split('_')[1];
                        calculateRow(idx);
                    }
                });
            });

            document.querySelectorAll('.persistent-cb').forEach(cb => {
                const storageKey = `cb_${cb.name}_${cb.value}`;
                if(localStorage.getItem(storageKey) === 'true') cb.checked = true;
                cb.addEventListener('change', () => localStorage.setItem(storageKey, cb.checked));
            });

            for(let i=0; i<5; i++) { calculateRow(i); }
        }

        function clearAllCache() {
            localStorage.clear();
        }

        document.getElementById('weeklyForm').addEventListener('submit', (e) => {
            e.preventDefault();
            overlay.style.display = 'flex';
            document.getElementById('loadingText').innerText = "每週總表資料打包傳輸中...";
            document.getElementById('submitBtn').disabled = true;

            const daysArr = ["週二", "週三", "週四", "週五", "週六"];
            const weeklyData = [];

            for(let i=0; i<5; i++) {
                const dateVal = document.getElementById(`date_${i}`).value;
                
                const hasData = document.getElementById(`orig_${i}`).value || document.getElementById(`new_${i}`).value || 
                                document.getElementById(`grad_${i}`).value || document.getElementById(`renew_${i}`).value || 
                                document.getElementById(`leave_${i}`).value || document.getElementById(`thour_${i}`).value || 
                                document.getElementById(`ahour_${i}`).value;
                                
                if(hasData && !dateVal) {
                    alert(`❌ 您填寫了【${daysArr[i]}】的數據，但忘記填上日期！請補上日期後再行送出。`);
                    document.getElementById(`box_${i}`).style.display = 'block'; 
                    overlay.style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                    return;
                }

                if(!dateVal) continue; 

                const tsChecked = [];
                document.querySelectorAll(`input[name="ts_${i}"]:checked`).forEach(cb => tsChecked.push(cb.value));

                weeklyData.push({
                    day: daysArr[i],
                    dateStr: dateVal, 
                    originalCount: document.getElementById(`orig_${i}`).value || 0,
                    newCount: document.getElementById(`new_${i}`).value || 0,
                    gradCount: document.getElementById(`grad_${i}`).value || 0,
                    renewCount: document.getElementById(`renew_${i}`).value || 0,
                    adjustReq: document.getElementById(`adj_${i}`).value,
                    shouldAttend: document.getElementById(`should_${i}`).value || 0,
                    leaveCount: document.getElementById(`leave_${i}`).value || 0,
                    actualCount: document.getElementById(`actual_${i}`).value || 0,
                    trialCount: document.getElementById(`trial_${i}`).value || 0,
                    teacherHours: document.getElementById(`thour_${i}`).value || 0,
                    actualHours: document.getElementById(`ahour_${i}`).value || 0,
                    leaveNames: document.getElementById(`leavename_${i}`).value,
                    timeSlots: tsChecked
                });
            }

            if(weeklyData.length === 0) {
                alert("❌ 請至少展開填寫其中一天的日期與報表資料再行提交！");
                overlay.style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                return;
            }

            const mainPayload = {
                monthWeek: document.getElementById('monthWeek').value,
                teacher: document.getElementById('teacher').value,
                weeklyData: weeklyData,
                notes: {
                    newStudent: document.getElementById('noteNewStudent').value,
                    gradRenew: document.getElementById('noteGradRenew').value,
                    makeup: document.getElementById('noteMakeup').value,
                    timeAdjust: document.getElementById('noteTimeAdjust').value
                }
            };

            fetch(GAS_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(mainPayload)
            }).then(() => {
                alert("【成功】大功告成！全週工作報表已順利匯入您在 Google 試算表的個人專屬分頁中！");
                clearAllCache(); 
                location.reload();
            }).catch(err => {
                alert("傳輸發生異常：" + err);
            }).finally(() => {
                overlay.style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            });
        });
    </script>
</body>
</html>
